name: publish

# Build the primary MkDocs knowledge base site at / and bolt the Spec-Blueprint dashboard onto /specs/.
on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - ".specs/**"
      - "specs/**"
      - "TECH_STACK.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml mkdocs-material pymdown-extensions mkdocs-redirects
      - name: Regenerate viz config + graph
        working-directory: knowledge
        run: python3 tools/kb.py viz
      - name: Build primary MkDocs site
        working-directory: knowledge
        run: mkdocs build --strict --site-dir site
      - name: Bolt Spec-Blueprint dashboard onto /specs/
        run: |
          VER=$(grep -i '^Spec-Blueprint:' TECH_STACK.md | sed -E 's/.*asdlc-meta-specs@([A-Za-z0-9._-]+).*/\1/' || true)
          VER=${VER:-latest}
          BASE_URL="https://jvanheerikhuize.github.io/asdlc-meta-specs/${VER}"
          curl -fsSL "${BASE_URL}/tools/spec.py" -o /tmp/spec.py
          python3 /tmp/spec.py --root . check --strict
          mkdir -p knowledge/site/specs
          for f in index.html app.js styles.css; do
            curl -fsSL "${BASE_URL}/site/${f}" -o "knowledge/site/specs/${f}"
          done
          sed -i 's|</nav>|<a href="../">← Primary Site</a></nav>|' knowledge/site/specs/index.html
          python3 /tmp/spec.py --root . index --out knowledge/site/specs/data/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: knowledge/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
